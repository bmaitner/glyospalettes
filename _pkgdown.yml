url: https://bmaitner.github.io/glyospalettes/

template:
  bootstrap: 5
  bslib:
    primary: "#1575CC"

home:
  title: glyospalettes - Glyos colorway palettes for R
  links:
    - text: Browse the palettes
      href: articles/browse.html
